<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Dynamic Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1"/>
    </pattern>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .wave-line {
      fill: none;
      stroke-linecap: round;
      opacity: 0.6;
    }
    .animated-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="300" fill="url(#grid)" rx="16"/>

  <!-- Dynamic / Animated Background Waveform Graphic (Speech Audio Visualization) -->
  <g opacity="0.4" filter="url(#glow)">
    <!-- Audio Waveform Paths -->
    <path class="wave-line" stroke="#8b5cf6" stroke-width="3" d="M 50,220 Q 150,80 250,180 T 450,120 T 650,220 T 850,140 T 1050,200 T 1150,100">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M 50,220 Q 150,80 250,180 T 450,120 T 650,220 T 850,140 T 1050,200 T 1150,100;
                M 50,200 Q 150,140 250,100 T 450,220 T 650,120 T 850,200 T 1050,120 T 1150,180;
                M 50,220 Q 150,80 250,180 T 450,120 T 650,220 T 850,140 T 1050,200 T 1150,100"/>
    </path>
    <path class="wave-line" stroke="#ec4899" stroke-width="2.5" d="M 50,240 Q 180,100 300,200 T 550,90 T 750,210 T 950,110 T 1150,230">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M 50,240 Q 180,100 300,200 T 550,90 T 750,210 T 950,110 T 1150,230;
                M 50,180 Q 180,220 300,120 T 550,200 T 750,100 T 950,210 T 1150,140;
                M 50,240 Q 180,100 300,200 T 550,90 T 750,210 T 950,110 T 1150,230"/>
    </path>
    <path class="wave-line" stroke="#3b82f6" stroke-width="2" d="M 50,160 Q 120,240 280,140 T 500,230 T 700,130 T 900,220 T 1150,150">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M 50,160 Q 120,240 280,140 T 500,230 T 700,130 T 900,220 T 1150,150;
                M 50,220 Q 120,120 280,200 T 500,110 T 700,210 T 900,130 T 1150,210;
                M 50,160 Q 120,240 280,140 T 500,230 T 700,130 T 900,220 T 1150,150"/>
    </path>
  </g>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="200" cy="80" r="100" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="220" r="120" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Foreground Content Block (Ensures titles remain crisp and unobstructed) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 42)">
      <rect width="320" height="32" rx="16" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="21" class="badge-text">🎙️ Sales Conversation Intelligence Ecosystem</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title">Awesome Sales Conversation Intelligence 🚀</text>

    <!-- Accent Underline Bar -->
    <rect x="0" y="142" width="680" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="182" class="subtitle">Curated SaaS Platforms & Open-Source AI Call Analytics Engines</text>
    <text x="0" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94a3b8">
      Call Recording • AI Diarization • Deal Risk Detection • Real-Time Sales Coaching • Revenue Intelligence
    </text>

    <!-- Bottom Feature Cards (Positioned lower so titles are fully in foreground) -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
        <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c084fc" font-weight="600">📊 Enterprise SaaS</text>
      </g>
      <g transform="translate(185, 0)">
        <rect width="180" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
        <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f472b6" font-weight="600">⚡ Open-Source AI</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="210" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
        <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#60a5fa" font-weight="600">🎙️ Offline Diarization</text>
      </g>
    </g>
  </g>
</svg>
